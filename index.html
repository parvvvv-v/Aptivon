<style>
/* ============ Tokens ============ */
:root {
  --navy: #1F3A5F;
  --navy2: #16293f;
  --brand: #2a78d6;
  --brandl: #cde2fb;
  --gold: #B8860B;
  --ink: #14161f;
  --ink2: #52514e;
  --mut: #6b7080;
  --line: #e1e0d9;
  --bd: rgba(11, 11, 11, .10);
  --bg: #f9f9f7;
  --surf: #fcfcfb;
  --good: #0ca30c;
  --goodbg: #e6f6e6;
  --warn: #c98500;
  --crit: #d03b3b;
  --red: #d03b3b;
}

/* ============ Base ============ */
* { box-sizing: border-box; }
body { margin: 0; font: 15px/1.55 'Plus Jakarta Sans', system-ui, sans-serif; color: var(--ink); background: var(--bg); }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; }
h2 { font-size: 26px; margin: 0 0 6px; letter-spacing: -.5px; color: var(--navy); }
h3 { margin: 0 0 4px; font-size: 16.5px; }
h5 { margin: 0; }
p { margin: 8px 0; }
.mut { color: var(--mut); font-size: 13px; }
.lnk { color: var(--brand); cursor: pointer; font-weight: 600; }
.lnk:hover { text-decoration: underline; }

/* ============ Header ============ */
header { position: sticky; top: 0; z-index: 20; background: var(--navy); color: #fff; display: flex; align-items: center; gap: 24px; padding: 0 28px; height: 66px; }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 20px; letter-spacing: -.4px; }
.logo .mark { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, var(--brand), var(--gold)); display: flex; align-items: center; justify-content: center; font-size: 13px; }
.logo i { font-style: normal; color: #9cc4f5; }
nav { display: flex; gap: 4px; flex: 1; }
.dd { position: relative; }
.dd > a, nav > a { padding: 22px 12px; display: block; font-weight: 600; font-size: 14px; color: #dbe5f1; }
.dd > a:hover { color: #fff; }
.dd > a:after { content: " ▾"; font-size: 10px; }
.dd div { display: none; position: absolute; top: 60px; left: 0; background: #fff; color: var(--ink); border: 1px solid var(--line); border-radius: 10px; min-width: 220px; padding: 8px; box-shadow: 0 12px 30px rgba(16, 26, 51, .18); }
.dd:hover div, .dd:focus-within div { display: block; }
.dd div a { display: block; padding: 9px 12px; border-radius: 6px; font-size: 14px; }
.dd div a:hover { background: var(--bg); color: var(--brand); }
#auth { display: flex; align-items: center; gap: 10px; }
.me { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13.5px; color: #fff; }
.me .av { width: 32px; height: 32px; border-radius: 50%; background: var(--brand); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }

/* ============ Buttons ============ */
.btn { background: var(--brand); color: #fff; border: 0; padding: 10px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; display: inline-block; }
.btn:hover { filter: brightness(.92); }
.btn.gold { background: var(--gold); }
.btn.o { background: #fff; color: var(--navy); border: 1px solid var(--navy); }
.btn.s { padding: 6px 14px; font-size: 13px; }
.ib { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; cursor: pointer; }
.ib:hover { border-color: var(--brand); }

/* ============ Hero / bands ============ */
.hero { background: linear-gradient(135deg, var(--navy), var(--navy2)); color: #fff; padding: 84px 28px 64px; position: relative; overflow: hidden; }
.hero:before, .hero:after { content: ""; position: absolute; border-radius: 50%; background: var(--brand); opacity: .2; animation: fl 9s ease-in-out infinite alternate; }
.hero:before { width: 420px; height: 420px; right: -90px; top: -120px; }
.hero:after { width: 260px; height: 260px; right: 240px; bottom: -130px; background: var(--gold); animation-delay: -4s; }
@keyframes fl { to { transform: translate(-40px, 30px) scale(1.12); } }
@media (prefers-reduced-motion: reduce) { .hero:before, .hero:after { animation: none; } }
.wrap { max-width: 1160px; margin: 0 auto; position: relative; }
.hero h1 { font-size: 44px; line-height: 1.12; margin: 0 0 14px; max-width: 720px; letter-spacing: -1px; }
.hero p { color: #cfd9e6; max-width: 580px; margin: 0 0 26px; }
.sbar { display: flex; gap: 8px; background: #fff; padding: 8px; border-radius: 12px; max-width: 640px; }
.sbar input { flex: 1; border: 0; outline: 0; padding: 0 16px; color: var(--ink); }
.stats { display: flex; gap: 44px; margin-top: 44px; }
.stats b { display: block; font-size: 30px; }
.stats span { color: #b4c3d8; font-size: 13px; }
.band { background: linear-gradient(135deg, var(--navy), var(--navy2)); color: #fff; padding: 34px 28px 28px; }
.band h2 { color: #fff; font-size: 26px; }
.band p { color: #cfd9e6; margin: 0 0 18px; max-width: 700px; font-size: 14px; }

/* ============ Layout ============ */
section.b { padding: 56px 28px; }
.page { max-width: 1160px; margin: 0 auto; padding: 30px 24px 70px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 18px; margin-top: 18px; }
.card { background: var(--surf); border: 1px solid var(--bd); border-radius: 10px; padding: 20px; }
.card + .card { margin-top: 16px; }
.grid3 .card + .card { margin-top: 0; }
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.full { grid-column: 1 / -1; }
.sec-label { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--mut); margin: 14px 0 8px; }

/* ============ Forms & filters ============ */
label { display: block; font-size: 12px; font-weight: 700; color: var(--ink2); margin-bottom: 3px; }
input, select, textarea { width: 100%; border: 1px solid var(--line); border-radius: 7px; padding: 9px 10px; background: #fff; color: var(--ink); }
input:focus, select:focus, textarea:focus { outline: 2px solid rgba(42, 120, 214, .35); border-color: var(--brand); }
.fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; background: #fff; padding: 12px; border-radius: 10px; border: 1px solid var(--bd); }
.ff label { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--mut); }
.ff .ck { display: flex; gap: 6px; align-items: center; font-size: 13px; font-weight: 500; color: var(--ink); text-transform: none; letter-spacing: 0; padding: 9px 0; }
.ff .ck input { width: auto; }
.srow { display: flex; gap: 8px; margin-top: 10px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; margin: 4px 0 14px; font-size: 11.5px; color: var(--ink2); }
.legend span { display: flex; align-items: center; gap: 5px; }
.dot { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
.toggle { display: flex; gap: 6px; margin: 6px 0 12px; }
.toggle button { border: 1px solid var(--line); background: #fff; padding: 7px 14px; border-radius: 20px; font-size: 12.5px; font-weight: 600; cursor: pointer; color: var(--ink2); }
.toggle button.on { background: var(--navy); color: #fff; border-color: var(--navy); }
.count { font-size: 12.5px; color: var(--mut); margin-bottom: 12px; }

/* ============ Tags & chips ============ */
.tr { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.tag { font-size: 11px; padding: 3px 9px; border-radius: 20px; font-weight: 600; background: var(--line); color: var(--ink2); display: inline-block; }
.tag.role { background: #eef2fb; color: var(--navy); }
.tag.hard { background: var(--brandl); color: var(--brand); }
.tag.soft { background: #fbeee0; color: var(--gold); }
.tag.loc { background: var(--line); color: var(--ink2); }
.tag.jobtype { background: #f1e9fb; color: #6a4aa7; }
.tag.industry { background: #eef7ee; color: var(--good); }
.tag.st { background: var(--goodbg); color: var(--good); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.chip { border: 1px solid var(--line); border-radius: 16px; padding: 5px 12px; font-size: 12px; cursor: pointer; color: var(--ink2); background: #fff; user-select: none; }
.chip.sel { background: var(--brand); border-color: var(--brand); color: #fff; }
.addc { display: flex; gap: 8px; margin-bottom: 14px; }

/* ============ Result cards ============ */
.pc { display: grid; grid-template-columns: 52px 1fr auto; gap: 14px; align-items: start; padding: 16px; border: 1px solid var(--bd); border-radius: 10px; background: var(--surf); margin-bottom: 10px; }
.ini { width: 52px; height: 52px; border-radius: 50%; background: var(--brandl); color: var(--brand); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; }
.ini.sq { border-radius: 12px; background: var(--navy); color: #fff; }
.ini.lg { width: 84px; height: 84px; font-size: 26px; }
.pc .meta { font-size: 13px; color: var(--ink2); }
.act { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
.match { font-size: 12px; color: var(--good); font-weight: 700; }
.pod { font-size: 10.5px; background: var(--navy); color: #fff; padding: 2px 8px; border-radius: 10px; font-weight: 700; margin-left: 6px; vertical-align: middle; }

/* ============ Profile (LinkedIn-style) ============ */
.pl { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; align-items: start; }
.cover { height: 90px; margin: -20px -20px 0; border-radius: 10px 10px 0 0; background: linear-gradient(120deg, var(--navy), var(--brand)); }
.hd { display: flex; gap: 18px; align-items: flex-end; margin-top: -42px; flex-wrap: wrap; }
.hd .ini { border: 4px solid #fff; background: var(--brandl); }
.hd h2 { margin: 0; }
.hd-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.sh { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.sh h3 { margin: 0; font-size: 17px; color: var(--navy); }
.ent { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.ent:last-child { border-bottom: 0; }
.ent .ico { width: 44px; height: 44px; border-radius: 8px; background: #eef2fb; display: flex; align-items: center; justify-content: center; font-size: 20px; }
.ent p { margin: 4px 0 0; font-size: 13.5px; white-space: pre-line; }
.ea { display: flex; gap: 6px; }
.tiles { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.tile { border: 1px solid var(--bd); border-radius: 8px; padding: 10px 16px; min-width: 110px; background: #fff; }
.tile .l { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--mut); }
.tile .v { font-size: 20px; font-weight: 700; color: var(--navy); }
.meter { height: 10px; background: var(--line); border-radius: 8px; overflow: hidden; }
.meter div { height: 100%; background: var(--brand); transition: width .8s; }
.side h4 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--mut); }
.empty { color: var(--mut); font-size: 13.5px; padding: 6px 0; }

/* ============ Dashboard ============ */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 20px; overflow-x: auto; }
.tabs button { background: none; border: 0; padding: 10px 16px; font-weight: 600; font-size: 13.5px; color: var(--ink2); cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
.tabs .on { color: var(--navy); border-color: var(--brand); }
table.rt { width: 100%; border-collapse: collapse; font-size: 13px; }
table.rt th { text-align: left; color: var(--mut); text-transform: uppercase; font-size: 10.5px; padding: 8px; border-bottom: 2px solid var(--line); }
table.rt td { padding: 10px 8px; border-bottom: 1px solid var(--line); }
.cy { color: var(--good); font-weight: 700; font-size: 12px; }
.cp { color: var(--warn); font-weight: 700; font-size: 12px; }
.pipe { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.pcol { background: #fff; border: 1px solid var(--bd); border-radius: 10px; padding: 10px; }
.pcol h5 { font-size: 11.5px; text-transform: uppercase; color: var(--mut); display: flex; justify-content: space-between; margin-bottom: 10px; }
.pcard { background: var(--bg); border: 1px solid var(--bd); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; font-size: 12.5px; }
.pcard select { margin-top: 6px; padding: 5px 8px; font-size: 12px; }
.podc { border: 1px solid var(--bd); border-radius: 10px; padding: 16px; background: var(--surf); margin-bottom: 12px; display: flex; justify-content: space-between; gap: 12px; }
.ohead { display: flex; gap: 16px; align-items: center; }
.ohead .ini { width: 64px; height: 64px; font-size: 20px; }

/* ============ Modal & toast ============ */
.modal { position: fixed; inset: 0; background: rgba(10, 15, 32, .65); display: none; align-items: center; justify-content: center; z-index: 50; }
.modal.on { display: flex; }
.modal .card { width: min(430px, 92vw); max-height: 90vh; overflow: auto; animation: pop .25s; }
.modal .card.wide { width: min(760px, 94vw); }
@keyframes pop { from { transform: scale(.94); opacity: 0; } }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 20px; border-radius: 24px; display: none; z-index: 60; }
footer { background: var(--navy2); color: #9fb0c8; padding: 36px 28px; font-size: 13px; }

/* ============ Responsive ============ */
@media (max-width: 860px) {
  header { flex-wrap: wrap; height: auto; padding: 10px 16px; gap: 6px 14px; }
  nav { order: 3; width: 100%; overflow-x: auto; flex: none; }
  .dd > a, nav > a { padding: 8px 10px; white-space: nowrap; }
  .dd div { display: none !important; }
  #auth { margin-left: auto; }
  .me span { display: none; }
  .form, .pl { grid-template-columns: 1fr; }
  .hero h1 { font-size: 30px; }
  .stats { gap: 22px; }
  .pc { grid-template-columns: 44px 1fr; }
  .pc .act { grid-column: 1 / -1; flex-direction: row; align-items: center; }
  .podc { flex-direction: column; }
}

/* ============ v2: landing, photos, groups ============ */
.lh{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.lh h1{font-size:50px}
.mesh{width:100%;height:auto}
.mesh .ln{stroke:rgba(156,196,245,.45);stroke-width:1.2;stroke-dasharray:4 6;animation:flow 3s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
.mesh .nd{animation:pulse 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.3)}}
.mlg{display:flex;gap:16px;justify-content:center;font-size:12px;color:#b4c3d8;margin-top:6px;flex-wrap:wrap}
.mlg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:center}
.ph{border-radius:14px;min-height:320px;background:linear-gradient(135deg,var(--navy),var(--brand));overflow:hidden;position:relative}
.ph img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.aud{display:flex;flex-direction:column;gap:10px}
.aud ul{margin:0;padding-left:18px;color:var(--ink2);font-size:13.5px;flex:1}
.demo{background:var(--navy);color:#fff;border-radius:14px;padding:24px}
.demo .big{font-size:58px;font-weight:800;line-height:1}
.demo .meter{background:rgba(255,255,255,.15);height:8px}
.demo .meter div{width:0;transition:width 1.6s cubic-bezier(.2,.7,.2,1)}
.demo.go .meter div{width:var(--w)}
.demo .jr{padding:10px 0;border-top:1px solid rgba(255,255,255,.12);font-size:13.5px}
.demo .jr b{float:right;color:#8fe08f}
.ctab{position:relative;color:#fff;text-align:center;padding:76px 28px;background:var(--navy);overflow:hidden}
.ctab img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.22}
.ctab .wrap{z-index:1}
.ctab h2{color:#fff;font-size:32px}
video.vid{width:100%;border-radius:14px;background:#000;max-height:520px}
.cover{position:relative;height:150px;background-size:cover}
.avw{position:relative}
img.ini{object-fit:cover;background:#fff}
.camb{position:absolute;right:12px;bottom:12px;border:0;background:#fff;border-radius:20px;padding:6px 10px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.camb.sm{right:-4px;bottom:-4px;padding:4px 7px;font-size:13px}
.me img.av{object-fit:cover}
@media (max-width:860px){.lh,.two{grid-template-columns:1fr}.lh h1{font-size:32px}}
@media (prefers-reduced-motion:reduce){.mesh .ln,.mesh .nd{animation:none}.demo .meter div{transition:none}}
.vbar{background:#fff4d6;color:#5c4300;padding:10px 28px;font-size:13.5px;border-bottom:1px solid #ecd48a}
.vbar .lnk{color:#5c4300;text-decoration:underline;cursor:pointer}

/* ============ v3: Red Global style hero + Catalant style motion ============ */
:root{--hot:#ff4b2b;--hot2:#ff7a45}
header{backdrop-filter:blur(10px);background:rgba(22,41,63,.94);box-shadow:0 1px 0 rgba(255,255,255,.06)}
.dd>a,nav>a{position:relative}
.dd>a:before,nav>a:before{content:"";position:absolute;left:12px;right:12px;bottom:14px;height:2px;background:var(--hot);transform:scaleX(0);transform-origin:left;transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.dd:hover>a:before,nav>a:hover:before{transform:scaleX(1)}
#auth{gap:8px;flex-wrap:wrap;justify-content:flex-end}
.hl{display:inline-flex;align-items:center;gap:6px;color:#fff;font-weight:600;font-size:13.5px;padding:6px 8px;position:relative}
.hl span{background:linear-gradient(currentColor,currentColor) 0 100%/0 2px no-repeat;transition:background-size .3s}
.hl:hover span{background-size:100% 2px}
.pill{border-radius:999px;padding:9px 18px;font-weight:700;font-size:13.5px;cursor:pointer;border:1px solid transparent;transition:transform .25s,box-shadow .25s,background .25s,color .25s;white-space:nowrap}
.pill.hot{background:linear-gradient(135deg,var(--hot),var(--hot2));color:#fff;box-shadow:0 6px 18px rgba(255,75,43,.35)}
.pill.ol{background:transparent;color:#fff;border-color:rgba(255,255,255,.55)}
.pill:hover{transform:translateY(-2px)}
.pill.hot:hover{box-shadow:0 10px 26px rgba(255,75,43,.5)}
.pill.ol:hover{background:#fff;color:var(--navy);box-shadow:0 8px 20px rgba(0,0,0,.25)}
@media(max-width:1100px){.pill.ol:nth-of-type(3){display:none}}
@media(max-width:900px){.pill.ol{display:none}}

.hero.rg{min-height:620px;display:flex;align-items:center;padding:96px 28px 90px;background:#14243a;font-family:'Sora','Plus Jakarta Sans',sans-serif}
.hero.rg:before,.hero.rg:after{display:none}
.hero.rg .wrap{width:100%;z-index:2}
.hbg{position:absolute;inset:0;overflow:hidden}
.hbg img{width:100%;height:100%;object-fit:cover;animation:kb 22s ease-in-out infinite alternate;filter:saturate(1.15)}
@keyframes kb{from{transform:scale(1) translateX(0)}to{transform:scale(1.14) translateX(-2%)}}
.hero.rg .tint{position:absolute;inset:0;background:linear-gradient(100deg,rgba(14,26,46,.92) 0%,rgba(31,58,95,.72) 45%,rgba(255,75,43,.28) 100%),radial-gradient(60% 80% at 100% 0%,rgba(255,75,43,.55),transparent 70%);animation:tintp 9s ease-in-out infinite alternate}
@keyframes tintp{to{opacity:.82}}
.streak{position:absolute;top:-20%;width:90px;height:140%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);filter:blur(14px);transform:rotate(18deg);z-index:1;animation:sweep 11s linear infinite}
.streak.s1{left:-10%}.streak.s2{left:-10%;animation-delay:-4s;width:150px;opacity:.7}.streak.s3{left:-10%;animation-delay:-8s;width:60px}
@keyframes sweep{to{left:115%}}
.hero.rg h1{font-weight:300;font-size:58px;letter-spacing:-1.5px;line-height:1.08}
.hero.rg h1 b{font-weight:700}
.hero.rg p{color:#e3ebf6;font-size:16.5px}
.abtn{display:inline-flex;align-items:center;gap:30px;justify-content:space-between;background:rgba(20,55,85,.92);color:#fff;border:0;padding:16px 26px;font-weight:600;font-size:15px;cursor:pointer;margin:0 8px 10px 0;position:relative;overflow:hidden;transition:background .3s,transform .3s}
.abtn:before{content:"";position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--hot);transition:width .35s}
.abtn:hover{background:var(--hot);transform:translateY(-2px)}
.abtn:hover:before{width:100%;background:#fff}
.abtn i{font-style:normal;transition:transform .3s}
.abtn:hover i{transform:translateX(6px)}
.hero-login{margin-left:6px}
.scrollhint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);font-size:12px;color:#fff;opacity:.7;letter-spacing:.12em;text-transform:uppercase;animation:bob 2s ease-in-out infinite;z-index:2}
@keyframes bob{50%{transform:translate(-50%,6px)}}
.hero.rg .mesh{filter:drop-shadow(0 12px 30px rgba(0,0,0,.35))}

/* scroll reveal */
.rv{opacity:0;transform:translateY(28px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
.rv.d2{transition-delay:.15s}.rv.d3{transition-delay:.3s}
.hero .rv{animation:rvin 1s .1s both}.hero .rv.d2{animation-delay:.3s}
@keyframes rvin{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
.hero .rv{opacity:1;transform:none;transition:none}

/* hover effects */
.grid3 .card{transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s,border-color .35s;position:relative;overflow:hidden}
.grid3 .card:before{content:"";position:absolute;left:0;top:0;height:3px;width:100%;background:linear-gradient(90deg,var(--hot),var(--gold));transform:scaleX(0);transform-origin:left;transition:transform .45s}
.grid3 .card:hover{transform:translateY(-8px);box-shadow:0 18px 40px rgba(31,58,95,.18);border-color:transparent}
.grid3 .card:hover:before{transform:scaleX(1)}
.ph img{transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.ph:hover img{transform:scale(1.07)}
.ph{box-shadow:0 20px 50px rgba(31,58,95,.2)}
section.b h2{position:relative;display:inline-block}
section.b h2:after{content:"";display:block;height:3px;width:40%;margin-top:6px;background:var(--hot);border-radius:2px;transition:width .5s}
section.b:hover h2:after{width:100%}
.chips .chip{transition:transform .25s,background .25s,color .25s,box-shadow .25s}
.chips .chip:hover{transform:translateY(-3px);background:var(--navy);color:#fff;box-shadow:0 8px 18px rgba(31,58,95,.25)}
.btn{transition:transform .25s,box-shadow .25s,filter .25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(31,58,95,.22)}
.demo{transition:transform .4s,box-shadow .4s}.demo:hover{transform:translateY(-6px);box-shadow:0 24px 50px rgba(0,0,0,.3)}
.demo .jr{transition:padding-left .3s,background .3s}.demo .jr:hover{padding-left:10px;background:rgba(255,255,255,.06)}
.ctab img{animation:kb 24s ease-in-out infinite alternate}
@media(max-width:860px){.hero.rg h1{font-size:34px}.hero.rg{min-height:520px}}
@media(prefers-reduced-motion:reduce){.hbg img,.streak,.tint,.scrollhint,.ctab img{animation:none}.rv{opacity:1;transform:none;transition:none}}

/* ===== Landing additions: nav, services, news, logos, team, contact ===== */
nav > a.nv, nav .dd > a.nv{cursor:pointer}
#hire,#services,#news{scroll-margin-top:72px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--brand);margin:0 0 8px}
.sec-h{text-align:center;max-width:720px;margin:0 auto 10px}
.sec-h h2{font-size:34px;letter-spacing:-.8px}
.sec-sub{text-align:center;color:var(--mut);max-width:640px;margin:0 auto 26px}
.svc{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.svc .card{transition:transform .25s,box-shadow .25s,border-color .25s;border-top:3px solid transparent}
.svc .card:hover{transform:translateY(-6px);box-shadow:0 18px 36px rgba(20,36,58,.12);border-top-color:var(--brand)}
.svc .ic{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--navy));color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:12px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;margin-top:20px;counter-reset:st}
.steps .st{position:relative;background:var(--surf);border:1px solid var(--bd);border-radius:12px;padding:24px 20px 20px}
.steps .st:before{counter-increment:st;content:counter(st);position:absolute;top:-16px;left:18px;width:34px;height:34px;border-radius:50%;background:var(--gold);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.news-tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:0 0 22px}
.news-tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 18px;font-weight:700;cursor:pointer;color:var(--navy);transition:.2s}
.news-tabs button.on,.news-tabs button:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.ncard{display:flex;flex-direction:column;background:#fff;border:1px solid var(--bd);border-radius:14px;overflow:hidden;transition:transform .3s,box-shadow .3s}
.ncard:hover{transform:translateY(-6px);box-shadow:0 20px 40px rgba(20,36,58,.16)}
.ncard .im{position:relative;height:180px;overflow:hidden;background:linear-gradient(135deg,var(--navy),var(--brand))}
.ncard .im img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.ncard:hover .im img{transform:scale(1.08)}
.ncard .im:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(14,26,46,.65))}
.ncard .tag{position:absolute;left:12px;bottom:10px;z-index:1;color:#fff;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:rgba(255,75,43,.9);padding:3px 9px;border-radius:999px}
.ncard .bd{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.ncard h4{margin:0;font-size:15.5px;line-height:1.35;color:var(--navy)}
.ncard p{margin:0;font-size:13px;color:var(--mut);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ncard .ft{margin-top:auto;font-size:12px;color:var(--mut);display:flex;justify-content:space-between;gap:8px}
.nsk{height:300px;border-radius:14px;background:linear-gradient(100deg,#eceae4 30%,#f6f5f1 50%,#eceae4 70%);background-size:200% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.logos{background:#fff;border-top:1px solid var(--line);padding:46px 0 52px;overflow:hidden}
.logos h3{text-align:center;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:0 0 26px}
.lmq{display:flex;gap:18px;width:max-content;animation:mq 38s linear infinite}
.logos:hover .lmq{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}
.lg{display:flex;align-items:center;gap:12px;padding:14px 26px;border:1px solid var(--line);border-radius:12px;background:var(--surf);min-width:190px;filter:grayscale(1);opacity:.8;transition:.3s}
.lg:hover{filter:none;opacity:1;transform:translateY(-3px);box-shadow:0 10px 24px rgba(20,36,58,.12)}
.lg img{width:38px;height:38px;object-fit:contain;border-radius:6px}
.lg b{font-size:15px;color:var(--navy)}
@media(prefers-reduced-motion:reduce){.lmq,.nsk{animation:none}}
.pf-ban{height:170px;border-radius:14px 14px 0 0;background:linear-gradient(120deg,var(--navy),var(--brand) 60%,var(--gold))}
.pf{padding:0;overflow:hidden}
.pf .in{padding:0 28px 28px;margin-top:-52px}
.pf .avl{width:104px;height:104px;border-radius:50%;background:var(--navy);color:#fff;border:4px solid #fff;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800}
.pf h1{margin:12px 0 2px;font-size:28px;color:var(--navy)}
.pf .li{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}
.pf .ex{border-left:2px solid var(--line);padding:0 0 14px 16px;margin-left:6px}
.ctgrid{display:grid;grid-template-columns:1.2fr 1fr;gap:20px}
@media(max-width:860px){.ctgrid{grid-template-columns:1fr}.sec-h h2{font-size:26px}}

/* ===== Round 2: industry dropdown, colour themes, live news ===== */
.msd{border:1px solid var(--line);border-radius:8px;background:#fff}
.msd .msb{width:100%;text-align:left;background:none;border:0;padding:10px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;color:var(--ink);font-weight:500}
.msd .msb:after{content:"▾";color:var(--mut)}
.msd.open .msb:after{content:"▴"}
.msd .msp{display:none;max-height:210px;overflow:auto;padding:6px 12px 10px;border-top:1px solid var(--line);grid-template-columns:1fr;gap:6px}
.msd.open .msp{display:grid}
.msd .msp label{display:flex;gap:8px;align-items:center;font-weight:500;color:var(--ink);margin:0;text-transform:none;letter-spacing:0;font-size:13.5px}
.msd .msp input{width:auto}
section.b{position:relative;overflow:hidden}
section.b:before{content:"";position:absolute;width:380px;height:380px;border-radius:50%;right:-120px;top:-140px;background:radial-gradient(circle,rgba(42,120,214,.16),transparent 70%);pointer-events:none}
section.b:after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;left:-110px;bottom:-130px;background:radial-gradient(circle,rgba(255,75,43,.12),transparent 70%);pointer-events:none}
section.b .wrap{z-index:1}
section.b.t-sky{background:linear-gradient(135deg,#e3eefc,#f2f7ff 55%,#fdf1de)}
section.b.t-sand{background:linear-gradient(135deg,#fff3dc,#fffaf1 55%,#ffe9e6)}
section.b.t-mint{background:linear-gradient(135deg,#dff6f2,#f2fbf9 55%,#e6effc)}
section.b.t-ice{background:linear-gradient(160deg,#ece6ff,#f7f4ff 60%,#e4f1ff)}
section.b.t-dark{color:#fff;background:radial-gradient(60% 90% at 92% 0%,rgba(255,75,43,.38),transparent 70%),radial-gradient(50% 80% at 0% 100%,rgba(42,120,214,.45),transparent 70%),linear-gradient(135deg,#16293f,#1F3A5F)}
.t-dark h2,.t-dark h3{color:#fff}
.t-dark .mut,.t-dark .sec-sub{color:#cfd9e6}
.t-dark .eyebrow{color:#ffb35c}
.t-dark .st{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2)}
.t-dark .btn.o{background:transparent;color:#fff;border-color:#8fa6c4}
.sec-h h2:after{content:"";display:block;width:56px;height:4px;border-radius:4px;margin:12px auto 0;background:linear-gradient(90deg,var(--brand),#ff4b2b)}
.svc .card,.grid3 .card.aud{border-top:4px solid var(--brand)}
.svc .card:nth-child(4n+2),.grid3 .card.aud:nth-child(3n+2){border-top-color:var(--gold)}
.svc .card:nth-child(4n+3),.grid3 .card.aud:nth-child(3n+3){border-top-color:#ff4b2b}
.svc .card:nth-child(4n+4){border-top-color:#12b5a6}
.svc .card:nth-child(4n+2) .ic{background:linear-gradient(135deg,var(--gold),#e0a93a)}
.svc .card:nth-child(4n+3) .ic{background:linear-gradient(135deg,#ff4b2b,#ff8a5c)}
.svc .card:nth-child(4n+4) .ic{background:linear-gradient(135deg,#12b5a6,#2fd3c3)}
.svc .card:nth-child(6) .ic{background:linear-gradient(135deg,#7a5af8,#a48bff)}
.svc .card:hover{border-top-color:#ff4b2b}
.t-mint .chip{background:#fff;border-color:#9fdcd5;color:#0f6f66}
.logos{background:linear-gradient(180deg,#fff,#e8f0fc 60%,#fdf1de)}
.lg{filter:none;opacity:1;background:#fff;text-decoration:none;box-shadow:0 4px 14px rgba(20,36,58,.06)}
.lg:hover{border-color:var(--brand)}
.nstat{text-align:center;font-size:12.5px;color:var(--mut);margin:-8px 0 18px}
.nstat i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#0ca30c;margin-right:6px;animation:pl 1.4s ease-in-out infinite}
@keyframes pl{50%{opacity:.25}}

/* ===== Landing: warm editorial look (cream + off-white, orange accent, burgundy base) ===== */
:root{--cream:#f6f3ec;--paper:#fdfcf9;--wine:#4a1222;--tile:#e9e4da}
/* sections alternate off-white / cream only */
section.b,section.b[class*="t-"]{background:var(--paper);color:var(--ink)}
#app section.b:nth-of-type(even),#app section.b[class*="t-"]:nth-of-type(even){background:var(--cream)}
section.b:before,section.b:after{display:none}
/* the one dark band keeps a calm burgundy */
section.b.t-dark{background:var(--wine)!important;color:#fff}
/* serif headings, mono eyebrows */
section.b h2,.sec-h h2,.ctab h2,.page .sec-h h2{font-family:'Newsreader',Georgia,'Times New Roman',serif;font-weight:400;letter-spacing:-.4px;color:#15121a;font-size:38px;line-height:1.12}
section.b h3{font-family:'Newsreader',Georgia,serif;font-weight:500;font-size:21px;color:#15121a}
.ctab h2{color:#fff}.t-dark h2,.t-dark h3{color:#fff}
section.b h2:after,.sec-h h2:after{display:none}
.sec-h{text-align:left;max-width:none;margin:0 0 26px}
.sec-sub{text-align:left;margin:0 0 26px;max-width:640px}
.eyebrow,.t-dark .eyebrow{font-family:'DM Mono',ui-monospace,Menlo,monospace;font-weight:400;font-size:12.5px;letter-spacing:.16em;color:var(--hot)}
/* flat beige cards, no borders / coloured tops */
section.b .card,section.b .st,.svc .card,.grid3 .card,.grid3 .card.aud{background:var(--cream);border:0!important;border-radius:6px;box-shadow:none}
#app section.b:nth-of-type(even) .card,#app section.b:nth-of-type(even) .st{background:var(--paper)}
.svc .card,.svc .card:nth-child(n),.grid3 .card.aud,.grid3 .card.aud:nth-child(n){border-top:0!important}
.grid3 .card:before{display:none}
.grid3 .card:hover,.svc .card:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(74,18,34,.10)}
.svc .ic,.svc .card:nth-child(n) .ic{background:var(--tile)!important;color:var(--wine);border-radius:6px;width:48px;height:48px}
.steps .st:before{background:var(--hot)}
.t-dark .st{background:rgba(255,255,255,.07)!important}
.fcard{background:var(--paper)!important}
.ph,.ncard{border-radius:6px;box-shadow:none}
.ph{box-shadow:none}
.ncard{background:var(--paper);border:1px solid var(--line)}
.ncard h4{font-family:'Newsreader',Georgia,serif;font-weight:500;font-size:18px;color:#15121a}
.ncard .tag{background:var(--cream);color:#15121a;font-family:'DM Mono',monospace;font-weight:400;font-size:10.5px;border-radius:4px}
.ncard .im:after{background:none}
.news-tabs button{background:transparent;border-color:var(--wine);color:var(--wine)}
/* chips: soft beige */
section.b .chip,.t-mint .chip{background:var(--tile);border-color:transparent;color:#15121a;border-radius:4px}
/* buttons: orange pill + outlined pill */
section.b .btn,.ctab .btn{border-radius:999px;background:var(--hot);color:#fff;padding:10px 22px}
section.b .btn.o,.t-dark .btn.o{background:transparent;color:var(--wine);border:1px solid var(--wine)}
.t-dark .btn.o{color:#fff;border-color:#fff}
/* logo strip, CTA, footer */
.logos{background:var(--paper);border-top:0}
.logos h3{font-family:'DM Mono',monospace;font-weight:400;color:var(--hot)}
.lg{background:var(--cream);border:0;border-radius:6px;box-shadow:none;filter:none;opacity:1}
.lg:hover{box-shadow:0 8px 20px rgba(74,18,34,.10)}
.lg b{color:#15121a}
.ctab,.ctab:before{background:var(--wine)}
.ctab:before{display:none}
.ctab img{opacity:.14}
footer{background:var(--wine);color:#e6d3d8}

/* ============================================================
   v4: Internal pages redesign (jobs, profile, dashboard, talent,
   groups, applications, modals). Presentation only.
   ============================================================ */
:root{--r:14px;--sh1:0 1px 2px rgba(20,22,31,.05),0 4px 14px rgba(20,22,31,.05);--sh2:0 2px 4px rgba(20,22,31,.06),0 14px 34px rgba(74,18,34,.12);--accent:#ff4b2b;--ring:0 0 0 3px rgba(42,120,214,.22)}
html{scroll-behavior:smooth}
body{background:var(--cream);-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
::selection{background:var(--brandl)}

/* ---- header (shared) ---- */
header{height:64px;box-shadow:0 1px 0 rgba(255,255,255,.06),0 6px 24px rgba(10,15,32,.18)}
.me{padding:4px 12px 4px 4px;border-radius:999px;background:rgba(255,255,255,.08);transition:background .2s}
.me:hover{background:rgba(255,255,255,.16)}
.me .av{background:linear-gradient(135deg,var(--brand),var(--accent))}
.dd div{border-radius:12px;border:0;box-shadow:0 18px 44px rgba(10,15,32,.28);padding:8px;top:58px}
.dd div a{border-radius:8px;font-weight:500}
.dd div a:hover{background:var(--cream);color:var(--wine)}

/* ---- page frame ---- */
.page{max-width:1180px;padding:34px 24px 80px}
.page>h2,.page h2{font-family:'Newsreader',Georgia,serif;font-weight:500;font-size:34px;letter-spacing:-.5px;color:#15121a;margin-bottom:14px}
.page h3,.card h3{font-family:'Newsreader',Georgia,serif;font-weight:500;font-size:20px;color:#15121a}
.sec-label{font-family:'DM Mono',ui-monospace,monospace;font-weight:400;font-size:11.5px;letter-spacing:.14em;color:var(--hot);margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.sec-label:after{content:"";flex:1;height:1px;background:var(--line)}
.mut{color:#6b6a72}

/* ---- hero band on search pages ---- */
.band{background:radial-gradient(60% 120% at 100% 0%,rgba(255,75,43,.35),transparent 65%),radial-gradient(50% 100% at 0% 100%,rgba(42,120,214,.35),transparent 70%),var(--wine);padding:44px 28px 34px}
.band h2{font-family:'Newsreader',Georgia,serif;font-weight:400;font-size:40px;letter-spacing:-.8px;margin-bottom:6px}
.band p{color:#e6d3d8;font-size:15px}
.fgrid{border:0;border-radius:var(--r);padding:16px;box-shadow:0 18px 40px rgba(0,0,0,.22);gap:12px}
.ff label{font-family:'DM Mono',monospace;font-size:10px;font-weight:400;letter-spacing:.12em}
.srow .btn.s[style*="background:#fff"]{background:rgba(255,255,255,.14)!important;color:#fff!important;border:1px solid rgba(255,255,255,.35)}

/* ---- inputs ---- */
input,select,textarea{border-radius:10px;border:1px solid #d9d6cc;padding:10px 12px;transition:border-color .2s,box-shadow .2s,background .2s}
input:hover,select:hover,textarea:hover{border-color:#bdb9ab}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--brand);box-shadow:var(--ring)}
input[type=checkbox]{accent-color:var(--hot);width:auto}
input[type=range]{accent-color:var(--hot);padding:0}
input[type=file]{padding:8px;background:var(--cream);border-style:dashed}
label{letter-spacing:.01em}
.msd{border-radius:10px;border-color:#d9d6cc}
.msd.open{box-shadow:var(--ring);border-color:var(--brand)}

/* ---- buttons ---- */
.page .btn,.modal .btn,.band .btn{border-radius:999px;background:var(--hot);padding:10px 22px;letter-spacing:.01em;box-shadow:0 4px 12px rgba(255,75,43,.22)}
.page .btn.s,.modal .btn.s,.band .btn.s{padding:7px 16px}
.page .btn.o,.modal .btn.o{background:transparent;color:var(--wine);border:1px solid rgba(74,18,34,.35);box-shadow:none}
.page .btn.o:hover,.modal .btn.o:hover{background:var(--wine);color:#fff;border-color:var(--wine);filter:none}
.btn:active{transform:translateY(0) scale(.98)}
.btn[disabled]{opacity:.5;pointer-events:none}
.ib{border-radius:8px;background:var(--cream);border-color:transparent;transition:background .2s,transform .2s}
.ib:hover{background:var(--brandl);transform:translateY(-1px)}
.lnk{color:var(--brand)}
.camb{box-shadow:0 4px 14px rgba(0,0,0,.28);font-weight:600;transition:transform .2s}
.camb:hover{transform:scale(1.06)}

/* ---- cards ---- */
.page .card,.modal .card{background:var(--paper);border:1px solid rgba(20,22,31,.07);border-radius:var(--r);box-shadow:var(--sh1)}
.modal .card{box-shadow:0 30px 80px rgba(10,15,32,.45);border:0;padding:26px}
.page .card+.card{margin-top:18px}
.empty{padding:14px;border:1px dashed var(--line);border-radius:10px;text-align:center;background:var(--cream)}

/* ---- result rows (jobs, talent, companies, applicants) ---- */
.pc{background:var(--paper);border:1px solid rgba(20,22,31,.07);border-radius:var(--r);padding:18px;box-shadow:var(--sh1);transition:transform .25s,box-shadow .25s,border-color .25s;position:relative}
.pc:hover{transform:translateY(-3px);box-shadow:var(--sh2);border-color:transparent}
.pc h3{margin:0 0 2px}
.pc h3 a{color:#15121a!important}
.pc h3 a:hover{color:var(--brand)!important;text-decoration:none}
.ini{background:linear-gradient(135deg,#dbe9fb,#f3e3d9);color:var(--wine);font-family:'Newsreader',serif;font-weight:500}
.ini.sq{background:linear-gradient(135deg,var(--wine),var(--navy));color:#fff;border-radius:14px}
img.ini{border:2px solid #fff;box-shadow:0 2px 8px rgba(20,22,31,.15)}
.match{background:var(--goodbg);padding:3px 10px;border-radius:999px;font-size:12px}
.pod{background:var(--wine);border-radius:999px;padding:3px 10px;letter-spacing:.04em}
.count{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.06em;color:var(--mut);padding:2px 0 10px}

/* ---- tags & legend ---- */
.tag{border-radius:999px;padding:3px 10px;font-weight:600;font-size:11.5px}
.tag.role{background:#e7edf9;color:var(--navy)}
.tag.hard{background:#dcebfc;color:#1d5fb3}
.tag.soft{background:#fbe9d6;color:#8a5a00}
.tag.jobtype{background:#eee6fa;color:#5d3fa0}
.tag.industry{background:#e3f4e3;color:#0a7a0a}
.tag.st{background:#fff0d6;color:#8a5a00}
.legend{padding:10px 14px;background:var(--paper);border-radius:10px;border:1px solid var(--line);display:inline-flex}
.dot{border-radius:50%}
.chip{border-radius:999px;padding:6px 14px;transition:all .2s}
.chip:hover{border-color:var(--brand);color:var(--brand)}
.chip.sel:hover{color:#fff;background:#1f66bd}
.toggle button{border-radius:999px;padding:8px 18px;transition:all .2s}
.toggle button:hover{border-color:var(--wine)}
.toggle button.on{background:var(--wine);border-color:var(--wine)}

/* ---- tabs ---- */
.tabs{border:0;background:#ebe7dd;padding:5px;border-radius:999px;display:inline-flex;max-width:100%;margin-bottom:24px;gap:2px}
.tabs button{border:0;border-radius:999px;padding:9px 18px;color:var(--ink2);transition:background .2s,color .2s}
.tabs button:hover{color:#15121a}
.tabs .on{background:#fff;color:var(--wine);box-shadow:0 2px 8px rgba(20,22,31,.12)}

/* ---- stat tiles ---- */
.tiles{gap:14px}
.tile{border:0;border-radius:var(--r);background:var(--paper);box-shadow:var(--sh1);padding:14px 20px;min-width:140px;position:relative;overflow:hidden}
.tile:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--hot),var(--gold))}
.tile .l{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.12em}
.tile .v{font-family:'Newsreader',serif;font-size:30px;font-weight:500;color:#15121a;line-height:1.2}
.meter{height:8px;border-radius:99px;background:#e8e4d9}
.meter div{border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--accent))}

/* ---- profile ---- */
.pl{gap:24px}
.cover{height:150px;border-radius:var(--r) var(--r) 0 0;background:linear-gradient(120deg,var(--wine),#a3341f 55%,var(--gold))}
.hd{margin-top:-52px}
.hd .ini{border:5px solid #fff;box-shadow:0 6px 18px rgba(20,22,31,.2)}
.ini.lg{width:104px;height:104px;font-size:32px}
.hd-top{align-items:flex-end}
.ent{padding:16px 0;transition:background .2s}
.ent .ico{border-radius:12px;background:var(--cream)}
.sh h3{color:#15121a}
.side .card{position:sticky;top:84px}
.side .card:not(:first-child){position:static}
.side h4{font-family:'DM Mono',monospace;font-weight:400;letter-spacing:.14em}

/* ---- pipeline (applicants kanban) ---- */
.pipe{gap:14px}
.pcol{background:#ece8de;border:0;border-radius:var(--r);padding:12px;min-height:140px}
.pcol h5{font-family:'DM Mono',monospace;font-weight:400;letter-spacing:.12em;padding-bottom:8px;margin-bottom:12px;border-bottom:3px solid var(--brand)}
.pcol:nth-child(2) h5{border-color:var(--gold)}
.pcol:nth-child(3) h5{border-color:#7a5af8}
.pcol:nth-child(4) h5{border-color:var(--good)}
.pcol:nth-child(5) h5{border-color:var(--crit)}
.pcol h5 span{background:#fff;border-radius:99px;padding:0 9px;color:var(--ink)}
.pcard{background:var(--paper);border:0;border-radius:10px;box-shadow:var(--sh1);padding:10px 12px;transition:transform .2s,box-shadow .2s}
.pcard:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.podc{border:0;border-radius:var(--r);box-shadow:var(--sh1);background:var(--paper)}
.ohead .ini{border-radius:16px}

/* ---- tables ---- */
table.rt th{font-family:'DM Mono',monospace;font-weight:400;letter-spacing:.1em}
table.rt tr:hover td{background:var(--cream)}

/* ---- modal ---- */
.modal{background:rgba(20,10,18,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:16px}
.modal .card{max-height:92vh;overscroll-behavior:contain;width:min(460px,94vw)}
.modal .card.wide{width:min(800px,94vw)}
.modal .card h2{font-family:'Newsreader',serif;font-weight:500;font-size:28px}
.modal .card .cover{margin:-26px -26px 0}
@keyframes pop{from{transform:translateY(14px) scale(.97);opacity:0}}

/* ---- toast ---- */
.toast{background:#15121a;border-radius:999px;padding:12px 24px;box-shadow:0 12px 34px rgba(0,0,0,.35);font-weight:600;font-size:14px;max-width:92vw;text-align:center;animation:tin .3s cubic-bezier(.2,.7,.2,1)}
.toast:before{content:"✓";color:#6ee06e;margin-right:10px;font-weight:800}
@keyframes tin{from{opacity:0;transform:translate(-50%,14px)}}

/* ---- verification bar ---- */
.vbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;text-align:center}

/* ---- loading state ---- */

/* ---- footer ---- */
footer{text-align:center}

/* ---- mobile ---- */
@media(max-width:860px){
  /* signed-in menus were hidden on phones; show their links as a scrollable row instead */
  .dd{display:flex;align-items:center}
  .dd>a:after{display:none}
  .dd>a{padding:8px 4px 8px 10px;color:#fff;font-weight:700}
  .dd div{display:flex!important;position:static;background:none;box-shadow:none;border-radius:0;padding:0;min-width:0;color:#dbe5f1}
  .dd div a{color:#dbe5f1;padding:8px 10px;white-space:nowrap;font-size:13.5px}
  .dd div a:hover{background:rgba(255,255,255,.1);color:#fff}
  .dd>a:before,nav>a:before{display:none}
  nav{gap:0;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  .page{padding:22px 16px 60px}
  .page>h2,.page h2{font-size:28px}
  .band{padding:30px 16px 24px}
  .band h2{font-size:30px}

const homeHash = () => P?.type === "org" ? "#/dashboard" : P?.type === "group" ? "#/groups" : "#/profile";
const av = (u, c = "") => u.photo ? `<img class="ini ${c}" src="${esc(u.photo)}" alt="">` : `<div class="ini ${c}">${esc(ini(u.name))}</div>`;
const url = u => /^https?:\/\//i.test(u) ? u : "https://" + u;
const tg = (c, x) => x ? (["role", "jobtype", "industry"].includes(c) ? csv(x) : [x]).map(v => `<span class="tag ${c}">${esc(v)}</span>`).join("") : "";
const tags = u => tg("role", u.role)
  + (u.skills || []).map(x => tg("hard", x)).join("")
  + (u.softSkills || []).map(x => tg("soft", x)).join("")
  + tg("loc", u.location) + tg("jobtype", u.jobType) + tg("industry", u.industry);

$("#techs")?.remove();

/* ---------- modal ---------- */
function modal(h, w) {
  $("#mbox").className = "card" + (w ? " wide" : "");
  $("#mbox").innerHTML = h;
  $("#modal").classList.add("on");
}
function closeM() { $("#modal").classList.remove("on"); }
let MD = false;
$("#modal").onmousedown = e => { MD = e.target.id === "modal"; };
$("#modal").onclick = e => { if (e.target.id === "modal" && MD && !PEND) closeM(); MD = false; };
window.closeM = closeM;
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#modal").classList.contains("on") && !PEND) closeM(); });

/* ---------- header / nav (role aware) ---------- */
function nav() {
  if (!me) {
    $("#nav").innerHTML = `<a class="nv" onclick="goSec('hire')">Hire</a><a class="nv" onclick="goSec('services')">Services</a><a class="nv" href="#/team">Our Team</a><a class="nv" href="#/contact">Contact</a>
      <div class="dd"><a class="nv" href="#/blog" tabindex="0">SAP</a><div><a href="#" onclick="sapGo('jobs');return false">SAP Jobs</a><a href="#" onclick="sapGo('talent');return false">SAP Talent Pool</a><a href="#/blog">SAP Blog</a></div></div>`;
    return;
  }
  const cand = isCand(), emp = isOrg(), grp = isGrp();
  $("#nav").innerHTML =
    (cand ? `<div class="dd"><a href="#/jobs" tabindex="0">Candidates</a><div>
      <a href="#/jobs">Find jobs</a><a href="#/profile">My profile &amp; ATS score</a><a href="#/applications">My applications</a><a href="#/mygroups">My groups</a></div></div>` : "")
    + (emp ? `<div class="dd"><a href="#/talent" tabindex="0">Employers</a><div>
      <a href="#/talent">Search talent</a><a href="#/dashboard">Employer dashboard</a><a href="#/dashboard?tab=post">Post a job</a>
      <a href="#/dashboard?tab=co">Company details</a></div></div>` : "")
    + (grp ? `<div class="dd"><a href="#/talent" tabindex="0">Consultancy / Group</a><div>
      <a href="#/talent">Search talent &amp; companies</a><a href="#/groups">My groups</a></div></div>` : "")
    + `<div class="dd"><a href="#/jobs" tabindex="0">Technologies</a><div>${TECH.map(t => `<a href="#/jobs?q=${encodeURIComponent(t)}">${t}</a>`).join("")}</div></div>`
    + `<a class="nv" href="#/services">Services</a><a class="nv" href="#/team">Our Team</a><a class="nv" href="#/contact">Contact</a>
      <div class="dd"><a class="nv" href="#/blog" tabindex="0">SAP</a><div><a href="#" onclick="sapGo('jobs');return false">SAP Jobs</a><a href="#" onclick="sapGo('talent');return false">SAP Talent Pool</a><a href="#/blog">SAP Blog</a></div></div>`;
}

const NAVBTN = [["Find Solutions", "candidate", "hot"], ["For Consultants", "group", "ol"], ["For Hiring", "org", "ol"], ["For Groups", "group", "ol"]];
function authBox() {
  $("#auth").innerHTML = me
    ? `<a class="me" href="${homeHash()}">${P?.photo ? `<img class="av" src="${esc(P.photo)}" alt="">` : `<span class="av">${esc(ini(P?.name))}</span>`}<span>${esc(P?.name || "")}</span></a>
       <button class="btn o s" style="background:transparent;color:#fff;border-color:#8fa6c4" onclick="logout()">Log out</button>`
    : `<a class="hl" href="#" onclick="authUI('login');return false"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 4a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7zm0 14.2a8 8 0 0 1-6-2.7c.1-2 4-3.1 6-3.1s5.9 1.100 6 3.100a8 8 0 0 1-6 2.700z"/></svg><span>Log in</span></a>
       ${NAVBTN.map(([l, t, c]) => `<button class="pill ${c}" onclick="authUI('signup','${t}')">${l}</button>`).join("")}`;
}

    <p class="mut">We sent a verification link to <b>${esc(email)}</b>. Open it, then come back here. Your account is created only after your email is verified. Check your spam folder if you can't find it.</p>
    <p id="v_err" class="mut" style="color:var(--red)"></p>
    <button class="btn" style="width:100%" onclick="finishSignup()">I've verified my email</button>
    <div class="srow"><button class="btn o s" onclick="resendSignup()">Resend email</button><button class="btn o s" onclick="cancelSignup()">Cancel</button></div>`);
  stopPoll(); PTIMER = setInterval(() => finishSignup(true), 3000);
}
window.finishSignup = async silent => {
  if (!PEND) return;
  const ve = $("#v_err");
  try {
    await PEND.user.reload();
    if (!PEND.user.emailVerified) { if (silent !== true && ve) ve.textContent = "Not verified yet. Open the link in your email first."; return; }
    stopPoll();
    const { user, d } = PEND;
    await user.getIdToken(true);
    await setDoc(doc(db, "users", user.uid), { ...d, created: serverTimestamp() });
    try { localStorage.removeItem("cm_pending_" + user.uid); } catch {}
    me = user; P = d; PEND = null; SIGNUP = false;
    closeM();
    location.hash = LAND[d.type];
    shell();
    toast("Email verified. Welcome to Aptivon!");
  } catch (x) { if (ve) ve.textContent = authMsg(x); }
};
window.resendSignup = async () => { try { await sendEmailVerification(PEND.user); toast("Verification email sent"); } catch (x) { toast(authMsg(x)); } };
window.cancelSignup = async () => { stopPoll(); PEND = null; SIGNUP = false; closeM(); await signOut(auth); };

window.doAuth = async mode => {
  const err = m => { const x = $("#a_err"); if (x) x.textContent = m; };
  try {
    const e = $("#a_e").value.trim(), p = $("#a_p").value;
    if (!/^\S+@\S+\.\S+$/.test(e)) throw { message: "Enter a valid email address." };
    if (!p) throw { message: "Enter your password." };
    if (mode == "login") {
      SIGNUP = true;
      await signInWithEmailAndPassword(auth, e, p);
      const u = auth.currentUser; SIGNUP = false;
      if (!u.emailVerified) {
        try { await sendEmailVerification(u); } catch {}
        await signOut(auth);
        throw { message: "Please verify your email first. We've sent you a new verification link." };
      }
      await loadUser(u);
      closeM();
      toast("Signed in");
      return;
    }
    const n = $("#a_n").value.trim(), t = $("#a_t").value, f = $("#a_f")?.value.trim() || "";
    if (!n) throw { message: "Enter a name." };
    if (t == "group" && !f) throw { message: "Enter your firm name." };
    const extra = read(SU[t]);
    const miss = SU[t].filter(([k]) => !(t == "group" && k == "website") && !String(extra[k] || "").trim());
    if (miss.length) throw { message: "Please fill in: " + miss.map(m => m[1].replace(/ \(.*\)/, "")).join(", ") + "." };
    if (t == "candidate" && (isNaN(+extra.years) || +extra.years < 0)) throw { message: "Years of experience must be a number." };
    if (t == "org" && !/^\S+@\S+\.\S+$/.test(extra.contactEmail)) throw { message: "Enter a valid hiring contact email." };
    if (p.length < 6) throw { message: "Password must be at least 6 characters." };
    SIGNUP = true;
    const c = await createUserWithEmailAndPassword(auth, e, p);
    const d = { type: t, name: n, email: e.toLowerCase(), ...extra, ...(t == "group" ? { firm: f } : {}) };
    try { localStorage.setItem("cm_pending_" + c.user.uid, JSON.stringify(d)); } catch {}
    PEND = { user: c.user, d };
    try { await sendEmailVerification(c.user); } catch {}
    showVerify(e);
  } catch (x) {
    SIGNUP = false;
    err(authMsg(x));
  }
};

async function loadUser(u) {
  let prof = null;
  for (let i = 0; i < 3 && !prof; i++) {
    try { prof = (await getDoc(doc(db, "users", u.uid))).data(); } catch {}
    if (!prof) await new Promise(r => setTimeout(r, 600));
  }
  if (!prof && u.emailVerified) {
    try {
      const raw = localStorage.getItem("cm_pending_" + u.uid);
      if (raw) {
        const d = JSON.parse(raw);
        await u.getIdToken(true);
        await setDoc(doc(db, "users", u.uid), { ...d, created: serverTimestamp() });
        localStorage.removeItem("cm_pending_" + u.uid);
        prof = d;
      }
    } catch {}
  }
  if (!prof) { toast("Could not load your profile. Please sign up again."); await signOut(auth); return; }
  me = u; P = prof;
  if (P.type == "group") try { await loadG(); } catch {}
  shell();
}

onAuthStateChanged(auth, async u => {
  if (SIGNUP) return;               /* signup / login flow handles itself */
  if (!u) { me = null; P = null; shell(); return; }
  if (!u.emailVerified) { await signOut(auth); return; }
  await loadUser(u);
});

/* ----- LinkedIn & Naukri job feed -----
   LinkedIn and Naukri have no public job-search API, so live postings come from the JSearch API (RapidAPI / OpenWeb Ninja),
   which aggregates both. Paste your key below. For production, put the call behind your own proxy (set url to the proxy and key to "")
   so the key is not visible in the browser. */
const EXT_JOBS = { url: "https://jsearch.p.rapidapi.com/search-v2", key: "580b1b6e8cmsh589419474867fc3p1f431ajsn5c8157c0da64", host: "jsearch.p.rapidapi.com", alt: [], query: "", location: "India", pages: 2 };
/* Job sites included in the live feed: [display name, search keyword, domain]. Add a line here to include another site. */
const EXT_SITES = [["LinkedIn", "linkedin", "linkedin.com"], ["Indeed", "indeed", "indeed.com"], ["Naukri", "naukri", "naukri.com"], ["Iimjobs", "iimjobs", "iimjobs.com"], ["Eursap", "eursap", "eursap.com"],
  ["FlexJobs", "flexjobs", "flexjobs.com"], ["Glassdoor", "glassdoor", "glassdoor.com"], ["Foundit", "foundit", "foundit.in"], ["Shine", "shine", "shine.com"], ["Hirist", "hirist", "hirist.tech"]];
const EXT_SRC = EXT_SITES.map(([n, v]) => [n, v]);
const EXT_HOST = new RegExp("^https://([a-z0-9-]+\\.)*(" + EXT_SITES.map(x => x[2].replace(/\./g, "\\.")).join("|") + ")([/?#].*)?$", "i");
const siteOf = u => { const h = String(u || "").replace(/^https?:\/\//i, "").split(/[\/?#]/)[0].toLowerCase(); const x = EXT_SITES.find(([, , d]) => h == d || h.endsWith("." + d)); return x ? x[0] : ""; };
const EXT_CACHE = {};
try { Object.assign(EXT_CACHE, JSON.parse(sessionStorage.getItem("extjobs2") || "{}")); } catch {}
const saveExt = () => { try { sessionStorage.setItem("extjobs2", JSON.stringify(EXT_CACHE)); } catch {} };
const srcName = j => j.source || siteOf(j.applyUrl);
const hash36 = t => { let h = 5381; for (const c of String(t)) h = ((h << 5) + h + c.charCodeAt(0)) >>> 0; return h.toString(36); };
const R_ROLE = { "Program Manager": /program manager/, "Project Manager": /project manager/, "Transformation Manager": /transformation/, "Solution Architect": /architect/, "Functional Consultant": /functional|consultant/, "Developer": /developer|programmer|software engineer|abap/, "Data Analyst": /data analyst|analytics|business analyst/, "Security Engineer": /security/ };
const R_SKILL = { "SAP S/4HANA": /s\/?4\s?hana/, "SAP FICO": /\bfico\b|sap fi\b|sap co\b/, "SAP MM": /\bsap mm\b/, "SAP SD": /\bsap sd\b/, "SAP ABAP": /\babap\b/, "SAP BASIS": /sap basis/, "SAP BTP": /\bbtp\b/, "JavaScript": /javascript|\bjs\b/, "React": /\breact(\.?js)?\b/, "AWS": /\baws\b|amazon web services/, "Power BI": /power\s?bi/, "Stakeholder Management": /stakeholder/, "Change Management": /change management/ };
const R_SOFT = { "Stakeholder Management": /stakeholder/, "Executive Communication": /executive communication|c-level/, "Negotiation": /negotiat/, "Mentoring": /mentor/, "Change Leadership": /change (leadership|management)/, "Cross-cultural Teams": /cross[- ]cultural/, "Problem Solving": /problem[- ]solving/, "Facilitation": /facilitat/ };
const R_IND = { "Manufacturing": /manufactur/, "Retail & CPG": /retail|\bcpg\b/, "BFSI": /\bbank|insurance|bfsi/, "Life Sciences": /life science/, "Technology": /software|technology|it services/, "Public Sector": /government|public sector/, "Healthcare Services": /healthcare|hospital/, "Transportation & Logistics": /logistics|transport|supply chain/, "Education": /education|universit/, "Energy & Utilities": /energy|utilit|\boil\b/, "Pharma & Biotech": /pharma|biotech/, "Financial Services": /financial services|fintech/, "Travel & Hospitality": /travel|hospitality|hotel/, "Entertainment & Media": /entertainment|\bmedia\b/, "Consumer Goods": /consumer goods|fmcg/, "Agriculture": /agricultur/ };
const hit = (map, t) => Object.keys(map).filter(k => map[k].test(t));
const normExt = (r, via) => {
  const opts = [...(r.apply_options || []), { publisher: r.job_publisher, apply_link: r.job_apply_link }];
  const ok = opts.filter(x => x && EXT_HOST.test(String(x.apply_link || "").trim()));
  const o = ok.find(x => siteOf(x.apply_link).toLowerCase() == via) || ok[0];
  if (!o) return null;
  const source = siteOf(o.apply_link);
  const title = r.job_title || "", desc = r.job_description || "", low = (title + " " + (r.employer_name || "") + " " + desc).toLowerCase(), tl = title.toLowerCase();
  let cc = r.job_country || ""; try { if (/^[A-Za-z]{2}$/.test(cc)) cc = new Intl.DisplayNames(["en"], { type: "region" }).of(cc.toUpperCase()); } catch {}
  const location = [r.job_city, r.job_state, cc].filter(Boolean).join(", ") + (r.job_is_remote ? " (Remote)" : "");
  const et = String(r.job_employment_type || "").toUpperCase();
  const jt = /intern/.test(tl) || et == "INTERN" ? "Internship" : /freelance/.test(low) ? "Freelance" : et == "PARTTIME" ? "Part-time" : et == "CONTRACTOR" || /\bcontract\b/.test(tl) ? "Contract" : "Permanent";
  const ts = r.job_posted_at_timestamp || (r.job_posted_at_datetime_utc ? Date.parse(r.job_posted_at_datetime_utc) / 1000 : 0);
  return { id: "x_" + hash36(r.job_id || o.apply_link), ext: true, source, applyUrl: o.apply_link.trim(), title, orgId: "", orgName: r.employer_name || source,
    location, desc, role: hit(R_ROLE, tl).join(", "), skills: SKILLS.filter(k => (R_SKILL[k] || new RegExp("\\b" + k.toLowerCase().replace(/[.*+?^${}()|[\]\\\/]/g, "\\$&") + "\\b")).test(low)),
    softSkills: hit(R_SOFT, low), jobType: jt, industry: hit(R_IND, low).join(", "), created: ts ? { seconds: ts } : null };
};
async function fetchExt(queries, loc, part, more) {
  /* one request at a time (free plans limit parallel calls); "more" continues each search from where it stopped */
  const errs = []; let total = 0;
  const kq = (q, via) => `${q ? q + " " : ""}jobs in ${loc} via ${via}`;
  const gather = () => {
    const seen = new Set(), jobs = []; let hasMore = false;
    queries.forEach(q => EXT_SRC.forEach(([nm, via]) => { const e = EXT_CACHE[nm + "|" + kq(q, via)]; if (!e) return; if (e.cursor) hasMore = true; e.jobs.forEach(x => { if (!seen.has(x.id)) { seen.add(x.id); jobs.push(x); } }); }));
    return { jobs, hasMore };
  };
  for (const q of queries) for (const [nm, via] of EXT_SRC) {
    total++;
    const query = kq(q, via), key = nm + "|" + query;
    try {
      let e = EXT_CACHE[key];
      if (!e || (more && e.cursor)) {
        const prm = { query, num_pages: String(EXT_JOBS.pages), country: "in", date_posted: "all" };
        if (e && more) prm.cursor = e.cursor;
        const r = await fetch(`${EXT_JOBS.url}?${new URLSearchParams(prm)}`, { headers: EXT_JOBS.key ? { "X-RapidAPI-Key": EXT_JOBS.key, "X-RapidAPI-Host": EXT_JOBS.host } : {} });
        if (!r.ok) throw new Error("HTTP " + r.status);
        const j = await r.json(), d = j.data, arr = Array.isArray(d) ? d : (d && Object.values(d).find(Array.isArray)) || [];
        const got = arr.map(x => { try { return normExt(x, via); } catch (er) { return null; } }).filter(Boolean);
        const old = e ? e.jobs : [], ids = new Set(old.map(x => x.id));
        e = EXT_CACHE[key] = { jobs: [...old, ...got.filter(x => !ids.has(x.id))], cursor: got.length ? ((d && !Array.isArray(d) && d.cursor) || j.cursor || "") : "" };
        saveExt();
        console.info(`JSearch "${query}"${more ? " (more)" : ""}: ${arr.length} results, ${got.length} with a ${nm} apply link, more available: ${!!e.cursor}`);
      }
      if (part) part(gather());
    } catch (e) { errs.push(String(e.message || e)); console.error("Job fetch failed:", e); }
  }
  return { ...gather(), failed: errs.length, total, err: errs[0] || "" };
}

  const draw = () => {
    let r = [...all, ...ext].filter(j => (!gv("k") || JSON.stringify({ ...j, applyUrl: "", source: "" }).toLowerCase().includes(gv("k")))
      && srcOk(j)
      && ma(j.role, "r")
      && ma(j.skills, "s")
      && ma(j.softSkills, "ss")
      && (!gv("l") || (j.location || "").toLowerCase().includes(gv("l")))
      && ma(j.jobType, "t")
      && ma(j.industry, "i"));
    r = r.map(j => ({ ...j, m: match(j) })).sort((a, b) => (b.m || 0) - (a.m || 0) || (b.created?.seconds || 0) - (a.created?.seconds || 0));
    lastLen = r.length;
    const more = r.length > shown || (hasMore && gv("src") != "own");
    const spin = `<span class="spin sm"></span>`;
    $("#res").innerHTML = `<div class="count">${busy && !r.length ? spin + "Loading…" : r.length + " job" + (r.length == 1 ? "" : "s")}${busy && r.length ? " " + spin : ""}${me && isCand() && myText().size && r.length ? " — ranked by match to your CV" : ""}</div>`
      + (r.slice(0, shown).map(jobCard).join("") || (busy ? `<div class="card empty-big"><div class="spin"></div><h3>Loading jobs…</h3><p class="mut">Just a moment</p></div>` : `<div class="card empty-big"><div class="em">🔎</div><h3>No jobs match these filters yet</h3><p class="mut">Try removing a filter or searching a broader keyword.</p><div class="srow"><button class="btn s" onclick="clearF()">Clear filters</button></div></div>`))
      + (more && r.length ? `<div id="moreb" style="text-align:center;margin:18px 0">${busy ? `<span class="spin"></span>` : `<button class="btn o" onclick="moreJobs()">Load more jobs</button>`}</div>` : "");
    if (io) io.disconnect();
    const mb = $("#moreb"); if (mb && io && r.length > shown) io.observe(mb);   /* auto-reveal the next batch while scrolling */
  };
  window.moreJobs = () => {
    if (shown < lastLen) { shown += 20; draw(); return; }
    if (hasMore && !busy) { busy = true; draw(); refreshExt(true); }
  };
  io = "IntersectionObserver" in window ? new IntersectionObserver(es => { if (es.some(e => e.isIntersecting) && shown < lastLen) { shown += 20; draw(); } }, { rootMargin: "600px" }) : null;
  /* pull live postings from all job sites that match the keyword, skill/role and location filters */
  const refreshExt = async (more = false) => {
    if (!EXT_JOBS.key && EXT_JOBS.url.includes("rapidapi")) { busy = false; return; }
    const kw = ($("#k")?.value || "").trim(), loc = ($("#l")?.value || "").trim() || EXT_JOBS.location;
    const qs = kw ? [kw] : gm("s").length ? gm("s").slice(0, 2) : gm("r").length ? gm("r").slice(0, 2) : [EXT_JOBS.query];
    const my = ++tok, note = $("#extst"); if (note) note.textContent = "";
    const out = await fetchExt(qs, loc, list => { if (my != tok) return; ext = list.jobs; hasMore = list.hasMore; ext.forEach(j => JOBS[j.id] = j); draw(); }, more);
    if (my != tok) return;
    busy = false;
    ext = out.jobs; hasMore = out.hasMore; ext.forEach(j => JOBS[j.id] = j);
    if (note) note.textContent = out.failed == out.total ? "Some jobs could not be loaded right now (" + (out.err || "unknown error") + ")." : out.failed ? "Some jobs could not be loaded (" + out.err + ")." : "";
    draw();
  };
  let tmr;
  $("#fg").oninput = () => { busy = !!EXT_JOBS.key; shown = 20; draw(); clearTimeout(tmr); tmr = setTimeout(() => refreshExt(), 700); };
  draw();
  refreshExt();
};

/* ----- ATS (built-in rule checks, used as a fallback) ----- */
function ats(t) {
  const l = t.toLowerCase(), w = l.split(/\s+/).length, tips = [];
  const sec = [["experience", "experience"], ["education", "education"], ["skills", "skills"], ["summary", "summary|profile|objective"]]
    .filter(([n, r]) => new RegExp(r).test(l) || (tips.push("Add a clear “" + n + "” section"), 0)).length * 8;
  const em = /[\w.-]+@[\w.-]+\.\w+/.test(l), ph = /\+?\d[\d\s()-]{8,}/.test(l);
  if (!em) tips.push("Add an email address");
  if (!ph) tips.push("Add a phone number");
  const nums = (l.match(/\d+%|\$\s?\d|\b\d{2,}\b/g) || []).length;
  if (nums < 6) tips.push("Quantify achievements (%, €, team size)");
  const len = w >= 300 && w <= 900 ? 15 : w >= 150 && w <= 1300 ? 9 : 3;
  if (len < 15) tips.push("Aim for 300–900 words");
  const skills = [...new Set([...SKILLS, ...SOFT])].filter(s => l.includes(s.toLowerCase()));
  if (skills.length < 6) tips.push("List more role-specific skills and tools");
  /* offline estimate only: weighted so a perfect 100 is not possible (max 88) */
  return { score: Math.min(88, Math.round(sec + (em ? 6 : 0) + (ph ? 4 : 0) + Math.min(nums, 10) * 1.5 + len + Math.min(skills.length, 12) * 1.5)), skills, tips };
}
/* ----- ATS scoring API -----
   Uses the public ATS Screener API (open source, no key needed): POST /api/analyze, mode "full-score".
   It scores the resume against 6 real ATS platforms (Workday, Taleo, iCIMS, Greenhouse, Lever, SuccessFactors);
   the score shown is the average of those 6. Docs: https://ats-screener.vercel.app/docs/api/endpoints/
   Limits: 10 requests/minute and 200/day per IP. If it is unreachable the built-in estimate above is used. */
const ATS_API = { url: "https://ats-screener.vercel.app/api/analyze", timeout: 60000 };
const sugText = x => typeof x == "string" ? x : x && typeof x == "object" ? [x.text, x.suggestion, x.fix, x.action, x.message, x.description, x.title].find(v => typeof v == "string" && v.trim()) || "" : "";
async function atsScore(t) {
  const local = ats(t), c = new AbortController(), to = setTimeout(() => c.abort(), ATS_API.timeout);
  try {
    const res = await fetch(ATS_API.url, { method: "POST", signal: c.signal, headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mode: "full-score", resumeText: t.slice(0, 50000) }) });
    if (!res.ok) throw new Error("ATS API " + res.status);
    const j = await res.json(), rs = (j.results || []).filter(r => typeof r.overallScore == "number");
    if (j._fallback || !rs.length) throw new Error("no result from ATS API");
    const score = Math.max(0, Math.min(100, Math.round(rs.reduce((a, r) => a + r.overallScore, 0) / rs.length))), l = t.toLowerCase();
    const seen = new Set(), tips = [];
    for (let i = 0; tips.length < 6 && i < 6; i++) for (const r of rs) {
      const arr = Array.isArray(r.suggestions) ? r.suggestions : r.suggestions ? [r.suggestions] : [], x = sugText(arr[i]).trim().slice(0, 160), k = x.toLowerCase();
      if (x && !seen.has(k) && tips.length < 6) { seen.add(k); tips.push(x); }
    }
    const found = rs.flatMap(r => r.breakdown?.keywordMatch?.matched || []).map(x => String(x).trim()).filter(x => x && l.includes(x.toLowerCase()));
    return { score, skills: [...new Set([...local.skills, ...found])].slice(0, 30), tips: tips.length ? tips : local.tips };
  } catch (e) { console.warn("ATS API unavailable, using built-in estimate:", e.message || e); return local; }
  finally { clearTimeout(to); }
}
async function pdfText(f) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const d = await pdfjsLib.getDocument({ data: await f.arrayBuffer() }).promise;
  let t = "";
  for (let i = 1; i <= d.numPages; i++) t += (await (await d.getPage(i)).getTextContent()).items.map(x => x.str).join(" ") + " ";
  return t;
}
window.resume = async f => {
  if (!f) return;
  $("#ares").textContent = "Analysing…";
  try {
    const r = await atsScore(await pdfText(f));
    /* keep the CV file itself (max 700 KB) so employers, groups and group mates can open it */
    let stored = false;
    if (f.size <= 700000) {
      try {
        const b64 = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(",")[1]); fr.onerror = () => rej(new Error("read failed")); fr.readAsDataURL(f); });
        try { await loadG(); } catch {}
        await setDoc(doc(db, "resumes", me.uid), { name: f.name, data: b64, groupIds: Object.keys(G), updated: serverTimestamp() }, { merge: true });

    } else toast("Score saved, but the CV file is over 700 KB so it could not be shared. Please upload a smaller PDF.");
    P = { ...P, atsScore: r.score, resumeSkills: r.skills, atsTips: r.tips, ...(stored ? { resumeName: f.name } : {}) };
    await setDoc(doc(db, "users", me.uid), { atsScore: r.score, resumeSkills: r.skills, atsTips: r.tips, ...(stored ? { resumeName: f.name } : {}) }, { merge: true });

};

  const b = $("#vbar"); if (!b) return;
  if (me && !me.emailVerified) {
    b.className = "vbar";
    b.innerHTML = `Verify your email: we sent a link to <b>${esc(me.email)}</b>. Until you verify you cannot edit, post, apply or search. <a class="lnk" onclick="resendVer()">Resend email</a> · <a class="lnk" onclick="checkVer()">I've verified</a>`;
  } else { b.className = ""; b.innerHTML = ""; }
}
window.resendVer = async () => {
  try { await sendEmailVerification(me); toast("Verification email sent"); }
  catch (e) { toast(authMsg(e)); }
};
window.checkVer = async silent => {
  if (!me) return;
  try {
    await me.reload();
    if (me.emailVerified) { await me.getIdToken(true); vbar(); toast("Email verified"); route(); }
    else if (silent !== true) toast("Not verified yet. Open the link in the email first.");
  } catch (e) { if (silent !== true) toast(authMsg(e)); }
};
window.addEventListener("focus", () => { if (me && !me.emailVerified) checkVer(true); });
/* every action that writes data requires a verified email (the security rules enforce this too) */
["upd", "post", "apply", "saveJob", "delJob", "setSt", "mkGroup", "addMember", "rmMember", "gToggle", "gNote", "toggleSave",
 "saveGProfile", "saveGroup", "cancelInv", "acceptInv", "declineInv", "saveSec", "delSec", "saveIntro", "saveAbout", "saveSkills", "saveOrg", "cropSave", "resume"].forEach(n => {
  const f = window[n]; if (f) window[n] = (...a) => ver() ? f(...a) : undefined;
});
/* ---------- mobile menu (hamburger) ---------- */
(() => {
  const h = document.querySelector("header"), b = $("#burger");
  if (!h || !b) return;
  const set = o => { h.classList.toggle("open", o); document.documentElement.classList.toggle("menu-open", o); b.setAttribute("aria-expanded", o); b.setAttribute("aria-label", o ? "Close menu" : "Open menu"); };
  b.onclick = () => set(!h.classList.contains("open"));
  h.addEventListener("click", e => { if (e.target.closest("nav a, #auth a, #auth button")) set(false); });
  window.addEventListener("hashchange", () => set(false));
  window.addEventListener("resize", () => { if (innerWidth > 1240) set(false); });
  document.addEventListener("keydown", e => { if (e.key == "Escape") set(false); });
})();
nav();
</script>
